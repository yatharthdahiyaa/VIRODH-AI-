# Virodh AI cluster: nginx (TLS terminator / load balancer) in front of N stateless gateway replicas.
#
#   set GROQ_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY / VIRODH_ADMIN_TOKEN in the environment (or a .env file
#   next to this file, never committed), then from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build --scale virodh=3
#
# Gateway → http://localhost:8080/v1   Console → http://localhost:8080/console (admin token required)
# After changing --scale, reload nginx so it re-resolves the replicas: docker compose -f deploy/docker-compose.yml exec nginx nginx -s reload
name: virodh

services:
  virodh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: virodh-ai:1.0
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VIRODH_ADMIN_TOKEN: ${VIRODH_ADMIN_TOKEN:?set VIRODH_ADMIN_TOKEN before starting the cluster}
      VIRODH_DB: /data/virodh.db              # shared by all replicas on this host (SQLite WAL)
      VIRODH_LOG_PROMPT_PREVIEW: "false"      # production: hashes only
      VIRODH_ALLOW_LOOPBACK: "false"          # behind a proxy, loopback means nothing
      VIRODH_MAX_CONCURRENT_SCANS: "4"
      VIRODH_OCR_THREADS: "2"                 # split cores between replicas
      OMP_NUM_THREADS: "2"
    volumes:
      - virodh-data:/data
      - model-cache:/home/virodh/.cache       # ResNet18 weights downloaded once
    expose: ["8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 2g}
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [virodh]
    ports: ["8080:8080"]
    volumes:
      - ./nginx/virodh.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  virodh-data: {}
  model-cache: {}
