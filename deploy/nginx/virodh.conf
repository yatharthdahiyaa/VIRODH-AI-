# nginx in front of Virodh replicas. Add TLS (listen 443 ssl; ssl_certificate ...) for any real deployment.

upstream virodh_backend {
    least_conn;                                   # inspections take seconds: balance by open requests
    server virodh:8000 max_fails=3 fail_timeout=10s;   # Docker DNS returns every replica at (re)load
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=virodh_perip:10m rate=20r/s;   # coarse per-IP flood guard; per-key limits live in Virodh

server {
    listen 8080;
    server_tokens off;

    client_max_body_size 12m;                     # = server.max_body_mb
    client_body_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 180s;                      # inspection + model call
    proxy_next_upstream error timeout;            # retry another replica only if it could not be reached

    # The gateway API
    location /v1/ {
        limit_req zone=virodh_perip burst=40 nodelay;
        limit_req_status 429;
        proxy_buffering off;                      # server-sent events stream straight through
        proxy_pass http://virodh_backend;
    }

    # Console API and metrics: internal networks only (the admin token is still required)
    location /admin/ {
        allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
        proxy_pass http://virodh_backend;
    }
    location = /metrics {
        allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
        proxy_pass http://virodh_backend;
    }

    # Website, docs, console UI, health probes
    location / {
        proxy_pass http://virodh_backend;
    }
}
